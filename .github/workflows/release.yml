name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发即干跑：仅构建 Windows x64 便携包，产物只留在 workflow 里，不建 GitHub Release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 带上事件名：手动干跑也能选 tag，和正式发布同组会把正在跑的发布取消掉
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 应用内更新摘要（src/whats-new/<版本>.json，见同目录 README）随安装包发出。漏写的话
  # 升级到这一版的用户什么也看不到；结构写坏的话弹窗渲染出错，整个应用落进错误页。
  # 放在最前面查，不白跑编译。推 tag 和 push main 同时发生，不能指望 CI 先跑完单测，
  # 所以这里自己跑一遍检查所有随包摘要的那份单测。
  whats-new-check:
    name: Check in-app what's new summaries
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 手动干跑可以在任意分支上跑，那时这一版的摘要可能还没写，只在推 tag 时要求存在
      - name: Require this version's summary
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="src/whats-new/${TAG#v}.json"
          if [ ! -f "$file" ]; then
            echo "::error file=$file::Missing $file. Write the in-app summary for $TAG (see src/whats-new/README.md); use \"items\": [] to skip the popup."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Validate all summaries
        run: pnpm vitest run tests/config/whatsNewEntries.test.ts

  release:
    name: Build Windows x64 portable ZIP
    needs: whats-new-check
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $channel) { throw 'Missing pinned Rust toolchain' }
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-x64-portable

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Verify portable packaging
        run: node --test tests/maintenance/windows-portable.test.mjs

      - name: Resolve Classic version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          $version = (Select-String -Path src/lib/classicVersion.ts -Pattern 'export const CLASSIC_VERSION = "([^"]+)"').Matches.Groups[1].Value
          $rustVersion = (Select-String -Path src-tauri/src/commands/misc.rs -Pattern 'const CLASSIC_VERSION: &str = "([^"]+)"').Matches.Groups[1].Value
          if (-not $version -or $version -ne $rustVersion) { throw 'Classic version constants differ or are missing' }
          if ($env:IS_TAG_PUSH -eq 'true' -and $env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match Classic version' }
          "classic=$version" >> $env:GITHUB_OUTPUT

      # 只编译 exe；不运行 bundler，也不需要 Tauri 签名私钥。
      - name: Build portable executable
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle -- --locked

      - name: Package portable ZIP
        shell: pwsh
        env:
          CLASSIC_VERSION: ${{ steps.version.outputs.classic }}
        run: |
          ./scripts/package-windows-portable.ps1 -Version $env:CLASSIC_VERSION
          $assets = @(Get-ChildItem -LiteralPath release-assets -File)
          if ($assets.Count -ne 1 -or $assets[0].Extension -ne '.zip') { throw 'Expected exactly one portable ZIP' }

      - name: Upload portable ZIP to workflow
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-portable
          path: release-assets/CC-Switch-Classic-v${{ steps.version.outputs.classic }}-Windows-Portable.zip
          if-no-files-found: error

  # 手动运行仅上传 Actions artifact；只有推版本标签才创建正式 Release。
  publish:
    name: Publish Windows portable Release
    needs: release
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout CHANGELOG source
        uses: actions/checkout@v6
        with:
          sparse-checkout: CHANGELOG.md

      - name: Download portable ZIP
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-portable
          path: release-assets

      - name: Validate release asset
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="release-assets/CC-Switch-Classic-${TAG}-Windows-Portable.zip"
          test -s "$expected"
          test "$(find release-assets -type f | wc -l)" -eq 1

      - name: Resolve release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            BEGIN { insec = 0 }
            /^## / {
              if (insec) { exit }
              if (index($0, "Classic") > 0 && index($0, ver) > 0) { insec = 1; next }
            }
            insec { print }
          ' CHANGELOG.md > changelog-section.md
          test -s changelog-section.md || { echo '::error::Missing Classic CHANGELOG section'; exit 1; }
          {
            echo "## CC Switch Classic ${TAG}"
            echo
            echo "### 本次更新"
            echo
            cat changelog-section.md
            echo
            echo "### 下载"
            echo
            echo "Windows x64 便携包：CC-Switch-Classic-${TAG}-Windows-Portable.zip。解压后运行 cc-switch.exe，并保留同目录的 portable.ini。"
            echo
            echo "需要已安装 Microsoft Edge WebView2 Runtime。便携版通过下载新 ZIP 手动更新，不提供安装器和签名更新清单。"
            echo
            echo "问题反馈：https://github.com/${REPO}/issues"
          } > release-notes.md

      - name: Publish portable ZIP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          name: CC Switch Classic ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/CC-Switch-Classic-${{ github.ref_name }}-Windows-Portable.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
